services:
  db:
    image: postgres:15-alpine
    container_name: interview_db
    restart: always
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=interview_coach
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  backend:
    build: ./backend
    container_name: interview_backend
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/interview_coach
    depends_on:
      - db
    ports:
      - '8000:8000'

volumes:
  postgres_data:
